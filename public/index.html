<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f9f9f9; color: #333; margin: 0; padding: 0; }
        
        /* Navigation Bar Styles */
        .navbar { background-color: #222; padding: 15px 0; text-align: center; margin-bottom: 30px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 20px; font-size: 18px; transition: color 0.3s; }
        .navbar a:hover { color: #00bcd4; }
        #cartLink { color: #00bcd4; border: 1px solid #00bcd4; padding: 5px 15px; border-radius: 20px; }

        h1 { text-align: center; margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Search and Filter Controls */
        .controls { max-width: 1200px; margin: 0 auto 30px auto; display: flex; gap: 15px; padding: 0 20px; }
        .search-bar { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .filter-dropdown { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background-color: white; cursor: pointer; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 20px 40px 20px; }
        .art-card { background: white; padding: 20px; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.2s; position: relative; }
        .art-card:hover { transform: translateY(-5px); }
        .image-placeholder { width: 100%; height: 250px; background-color: #e0e0e0; border-radius: 2px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #888; }
        h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        p { margin: 5px 0; color: #666; font-size: 0.9rem; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .price { font-weight: bold; color: #000; font-size: 1.1rem; }
        .buy-btn { background-color: #000; color: #fff; border: none; padding: 10px 20px; border-radius: 3px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .buy-btn:hover { background-color: #333; }
        .empty-state { grid-column: 1 / -1; text-align: center; color: #888; font-size: 1.2rem; padding: 40px; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/">Home Page</a>
        <a href="/about.html">About Us</a>
        <a href="/more.html">More</a>
        <a href="/cart.html" id="cartLink">Cart (0)</a>
    </nav>

    <h1>Featured Collections</h1>
    
    <!-- Controls with Price Filter -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search by artwork title or artist name...">
        <select id="mediumFilter" class="filter-dropdown">
            <option value="all">All Mediums</option>
        </select>
        <input type="number" id="maxPriceFilter" class="search-bar" placeholder="Max price ($)" min="0" style="max-width: 150px;">
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        let allArtworks = [];
        
        // --- NEW SHOPPING CART LOGIC ---
        // Load existing cart from browser memory or start empty
        let cart = JSON.parse(localStorage.getItem('gallery_cart')) || [];

        function updateCartCount() {
            document.getElementById('cartLink').innerText = `Cart (${cart.length})`;
        }

        function addToCart(id, title, price, imageUrl) {
            // Prevent buying the same unique painting twice
            const exists = cart.find(item => item.id === id);
            if (exists) {
                alert(`"${title}" is already in your cart!`);
                return;
            }

            // Add to cart array and save to browser storage
            cart.push({ id, title, price, imageUrl });
            localStorage.setItem('gallery_cart', JSON.stringify(cart));
            
            updateCartCount();
            alert(`Added "${title}" to your cart!`);
        }

        async function loadGallery() {
            try {
                const response = await fetch('/api/artworks');
                allArtworks = await response.json();
                populateFilters(allArtworks);
                renderGallery(allArtworks);
                updateCartCount(); // Update the counter when page loads
            } catch (error) {
                console.error("Error loading artwork:", error);
            }
        }

        function populateFilters(artworks) {
            const dropdown = document.getElementById('mediumFilter');
            const uniqueMediums = [...new Set(artworks.map(art => art.medium).filter(Boolean))];
            
            dropdown.innerHTML = '<option value="all">All Mediums</option>';
            uniqueMediums.forEach(medium => {
                dropdown.innerHTML += `<option value="${medium}">${medium}</option>`;
            });
        }

        function renderGallery(artworksToDisplay) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; 

            if (artworksToDisplay.length === 0) {
                gallery.innerHTML = `<div class="empty-state">No artworks match your search.</div>`;
                return;
            }

            artworksToDisplay.forEach(art => {
                const card = document.createElement('div');
                card.className = 'art-card';
                
                const safeImageUrl = art.imageUrl ? art.imageUrl : '';
                const imageHtml = art.imageUrl 
                    ? `<img src="${art.imageUrl}" alt="${art.title}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 2px; margin-bottom: 15px;">`
                    : `<div class="image-placeholder">Image Pending</div>`;

                // Notice the button now calls addToCart instead of buyArtwork
                card.innerHTML = `
                    ${imageHtml}
                    <h3>${art.title}</h3>
                    <p>${art.artist}</p>
                    <p><i>${art.medium}</i></p>
                    <div class="price-row">
                        <span class="price">$${art.price.toLocaleString()}</span>
                        <button class="buy-btn" onclick="addToCart(${art.id}, '${art.title.replace(/'/g, "\\'")}', ${art.price}, '${safeImageUrl}')">Add to Cart</button>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function filterGallery() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedMedium = document.getElementById('mediumFilter').value;
            const maxPriceInput = document.getElementById('maxPriceFilter').value;

            const filteredArt = allArtworks.filter(art => {
                const safeTitle = (art.title || '').toLowerCase();
                const safeArtist = (art.artist || '').toLowerCase();
                const matchesSearch = safeTitle.includes(searchTerm) || safeArtist.includes(searchTerm);
                const matchesMedium = selectedMedium === 'all' || art.medium === selectedMedium;
                const matchesPrice = maxPriceInput === '' || art.price <= Number(maxPriceInput);
                
                return matchesSearch && matchesMedium && matchesPrice;
            });

            renderGallery(filteredArt);
        }

        document.getElementById('searchInput').addEventListener('input', filterGallery);
        document.getElementById('mediumFilter').addEventListener('change', filterGallery);
        document.getElementById('maxPriceFilter').addEventListener('input', filterGallery);

        loadGallery();
    </script>
</body>
</html>
