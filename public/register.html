<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f9f9f9; color: #333; margin: 0; padding: 0; }
        .navbar { background-color: #222; padding: 15px 0; text-align: center; margin-bottom: 30px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 20px; font-size: 18px; transition: color 0.3s; }
        .navbar a:hover { color: #00bcd4; }
        .auth-box { max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background-color: #000; color: #fff; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        button:hover { background-color: #333; }
        .link { text-align: center; margin-top: 15px; display: block; color: #00bcd4; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">Home Page</a>
        <a href="/login.html">Login</a>
    </nav>

    <div class="auth-box">
        <h2 style="text-align: center; margin-top: 0;">Create an Account</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="phone" placeholder="Phone Number (Optional)">
            <input type="password" id="password" placeholder="Create Password" required>
            <button type="submit">Register</button>
        </form>
        <a href="/login.html" class="link">Already have an account? Log in here.</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Account created successfully! Please log in.');
                    window.location.href = '/login.html';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Registration failed. Check your connection.');
            }
        });
    </script>
</body>
</html>
